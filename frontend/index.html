<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#6D28D9" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6D28D9" />
    <meta name="msapplication-TileColor" content="#6D28D9" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Decentralized social platform built on Stacks, secured by Bitcoin" />
    <meta property="og:title" content="ChainVoice" />
    <meta property="og:description" content="Decentralized social platform built on Stacks, secured by Bitcoin" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ChainVoice" />
    <meta name="twitter:description" content="Decentralized social platform built on Stacks, secured by Bitcoin" />
    <title>ChainVoice</title>
    <!-- Prevent a white flash before React loads by applying the stored theme
         class to <html> synchronously, before main.tsx runs. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('chainvoice-theme');
          var dark =
            t === 'dark' ||
            (t !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
